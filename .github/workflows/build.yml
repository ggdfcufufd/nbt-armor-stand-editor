name: Build Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Build mod
        run: ./gradlew build --no-daemon -Dorg.gradle.jvmargs="-Xmx2G"
        env:
          GRADLE_OPTS: "-Xmx2048m"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NBT-Armor-Stand-Editor
          path: build/libs/*.jar
