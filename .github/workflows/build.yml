name: Build Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.3 --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2G"

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2G"

      - name: Kill Gradle Daemon
        if: always()
        run: ./gradlew --stop

      - name: Upload mod
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NBT-Armor-Stand-Editor
          path: build/libs/*.jar
