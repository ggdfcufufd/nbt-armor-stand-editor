- name: Build
  run: ./gradlew build --no-daemon
  env:
    GRADLE_OPTS: "-Xmx2g"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.3 --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2G"

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon || true
        env:
          GRADLE_OPTS: "-Xmx2G"

      - name: Get JAR filename
        id: get_jar
        run: |
          JAR_FILE=$(ls build/libs/*.jar | head -1)
          JAR_NAME=$(basename "$JAR_FILE")
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "JAR file: $JAR_NAME"

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "NBT Armor Stand Editor v1.0.0"
          body: |
            ## 📥 Прямая ссылка для скачивания:
            
            ```
            https://github.com/${{ github.repository }}/releases/download/v1.0.0/${{ steps.get_jar.outputs.jar_name }}
            ```
            
            ## 🎮 Установка:
            1. Скачай файл выше
            2. Установи Fabric Loader 0.14.22+
            3. Установи Fabric API
            4. Положи мод в папку `mods`
            
            ## 🔑 Использование:
            - Нажми **R** для открытия меню
            - Выбери блок и настрой NBT
            - Нажми Apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
