name: Build and Release Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.3 --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2G"

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon || true
        env:
          GRADLE_OPTS: "-Xmx2G"

      - name: Find JAR file
        id: find_jar
        run: |
          JAR_FILE=$(ls build/libs/*.jar | head -1)
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found: $JAR_FILE"

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "NBT Armor Stand Editor v1.0.0"
          body: |
            ## NBT Armor Stand Editor
            
            ### Возможности:
            - Редактирование NBT стоек для брони
            - Выбор блока из списка
            - Настройка количества
            - Пресет мини-блока
            - Открывается по клавише **R**
            
            ### Установка:
            1. Установи Fabric Loader 0.14.22+
            2. Установи Fabric API
            3. Положи этот мод в папку `mods`
            
            ### Использование:
            1. Поставь стойку для брони
            2. Подойди к ней
            3. Нажми **R**
            4. Настрой NBT и нажми Apply
          draft: false
          prerelease: false
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
